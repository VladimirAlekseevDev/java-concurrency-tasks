plugins {
    id 'base'
}

def junitVersion = providers.gradleProperty('junitVersion').get()
def mockitoVersion = providers.gradleProperty('mockitoVersion').get()

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    def mockitoAgent = configurations.create('mockitoAgent') {
        canBeConsumed = false
        transitive = false
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        testImplementation "org.mockito:mockito-core:${mockitoVersion}"
        testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
        add('mockitoAgent', "org.mockito:mockito-core:${mockitoVersion}")
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Explicit instrumentation for Mockito on modern JDKs.
        jvmArgumentProviders.add({ ->
            ["-javaagent:${mockitoAgent.singleFile.absolutePath}"]
        } as CommandLineArgumentProvider)

        testLogging {
            events 'failed', 'skipped'
            exceptionFormat = 'full'
        }
    }
}
